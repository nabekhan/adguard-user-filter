<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Filters and userscripts</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <section aria-labelledby="dnsfilters-title">
        <h2 id="dnsfilters-title">DNS filters</h2>
        <div id="dnsfilters" class="subscription-grid" aria-live="polite">
          Loading…
        </div>
      </section>

      <section aria-labelledby="adfilters-title">
        <h2 id="adfilters-title">Ad filters</h2>
        <div id="adfilters" class="subscription-grid" aria-live="polite">
          Loading…
        </div>
      </section>

      <section aria-labelledby="userscripts-title">
        <header class="section-header">
          <h2 id="userscripts-title">Userscripts</h2>
          <a class="button" href="userscripts.zip" download>Download all</a>
        </header>
        <div id="userscripts" aria-live="polite">Loading…</div>
      </section>
    </main>
  </body>
</html>
