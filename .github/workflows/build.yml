name: Build filters

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [dist/**]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run resolve-configs
      - run: npm run build
      - run: npx aglint
      - if: github.event_name == 'push'
        run: |
          git add --all
          git diff --cached --quiet || {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: format and rebuild filters [skip ci]'
            git push
          }
